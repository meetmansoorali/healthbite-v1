<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5faf7">
    <title>HealthBite</title>
    <link rel="icon" type="image/png" href="logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --page: #f4f9f6;
            --surface: #ffffff;
            --soft: #f0f8f4;
            --mint: #e6f4ed;
            --green: #145b43;
            --deep: #0d4936;
            --bright: #23805e;
            --text: #163329;
            --muted: #789087;
            --line: #e1eee7;
            --shadow: 0 12px 35px rgba(25, 77, 57, .055);
            --danger: #c34c4c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background: radial-gradient(circle at 48% 0%, #fff 0, var(--page) 60%);
            height: 100dvh;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }

        button, input {
            font: inherit;
        }

        button {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .app-shell {
            width: 100%;
            height: 100dvh;
            display: grid;
            grid-template-columns: 224px minmax(0, 1fr);
            gap: 18px;
            padding: 18px;
        }

        .sidebar, .main-panel {
            background: rgba(255, 255, 255, .9);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: var(--shadow);
            min-height: 0;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            padding: 20px 14px 14px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 0 8px 26px;
        }

        .brand img, .topbar-title img {
            width: 25px;
            height: 25px;
            object-fit: contain;
        }

        .brand-name {
            font-family: 'Poppins', sans-serif;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -.55px;
            color: var(--deep);
        }

        .nav-list {
            display: grid;
            gap: 6px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            border: 0;
            border-radius: 11px;
            padding: 11px 12px;
            background: transparent;
            color: #6c847a;
            font-size: 12px;
            text-align: left;
            transition: .2s;
        }

        .nav-item i {
            width: 15px;
            text-align: center;
            font-size: 13px;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--mint);
            color: var(--green);
        }

        .nav-item.active {
            font-weight: 600;
        }

        .sidebar-bottom {
            margin-top: auto;
            border-top: 1px solid var(--line);
            padding: 18px 6px 3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border-radius: 50%;
            background: #dcefe5;
            color: var(--green);
            font-size: 11px;
            font-weight: 700;
        }

        .profile-meta strong {
            display: block;
            font-size: 11px;
            font-weight: 600;
        }

        .profile-meta span {
            display: block;
            color: var(--muted);
            font-size: 10px;
            margin-top: 3px;
        }

        .sidebar-bottom .fa-chevron-right {
            margin-left: auto;
            color: #8aa69a;
            font-size: 10px;
        }

        .main-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            height: 66px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 1px solid rgba(225, 238, 231, .8);
            background: rgba(255, 255, 255, .7);
        }

        .topbar-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .topbar-title span {
            font-size: 13px;
            font-weight: 600;
            color: var(--deep);
        }

        .topbar-status {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #769187;
            font-size: 11px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #48a77e;
        }

        .chat-container {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 28px 28px 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .chat-width-limiter {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .welcome-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 7vh 12px 35px;
        }

        .welcome-mark {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            background: var(--mint);
            border-radius: 20px;
            color: var(--green);
            font-size: 25px;
            margin-bottom: 18px;
        }

        .welcome-panel h1 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(25px, 3vw, 34px);
            line-height: 1.25;
            letter-spacing: -1.2px;
            color: #153b2d;
            font-weight: 600;
        }

        .welcome-subtitle {
            margin-top: 9px;
            color: #617c70;
            font-size: 14px;
            line-height: 1.7;
        }

        .quick-section {
            width: min(100%, 600px);
            margin-top: 26px;
            text-align: left;
        }

        .quick-section h2 {
            font-size: 12px;
            font-weight: 600;
            color: var(--deep);
        }

        .quick-section p {
            margin-top: 4px;
            color: #8aa095;
            font-size: 11px;
        }

        .quick-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .quick-chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 1px solid transparent;
            background: #edf7f1;
            color: #356b55;
            padding: 9px 12px;
            border-radius: 999px;
            font-size: 11px;
        }

        .quick-chip:hover {
            background: #e1f2e8;
            border-color: #c9e5d5;
        }

        .welcome-footnote {
            margin-top: 28px;
            color: #9aafa5;
            font-size: 11px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(7px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-row {
            display: flex;
            width: 100%;
            gap: 12px;
            font-size: 13px;
            line-height: 1.7;
            animation: fadeIn .28s ease-out;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 82%;
            padding: 14px 17px;
            border-radius: 15px;
            word-break: break-word;
        }

        .message-row.user .message-bubble {
            background: #e8f5ee;
            border: 1px solid #d9eee2;
            color: #204a38;
            border-top-right-radius: 5px;
            font-weight: 500;
        }

        .message-row.ai {
            align-items: flex-start;
        }

        .ai-mark {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border-radius: 11px;
            background: #e6f4ec;
            color: var(--green);
            margin-top: 2px;
        }

        .message-row.ai .message-bubble {
            flex: 1;
            max-width: calc(100% - 44px);
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 15px;
            border-top-left-radius: 5px;
            box-shadow: 0 4px 14px rgba(25, 77, 57, .025);
        }

        .message-bubble img {
            max-width: 100%;
            max-height: 190px;
            border-radius: 10px;
            margin-top: 10px;
            display: block;
        }

        .message-bubble strong {
            color: var(--deep);
            font-weight: 700;
        }

        .message-bubble br + strong {
            display: inline-block;
            margin-top: 7px;
        }

        .message-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 12px;
            padding-top: 9px;
            border-top: 1px solid var(--line);
        }

        .icon-action {
            border: 1px solid var(--line);
            background: #f7fbf8;
            color: #638174;
            border-radius: 9px;
            padding: 7px 10px;
            font-size: 11px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .icon-action.saved {
            background: #e6f4ed;
            color: var(--green);
            border-color: #c6e4d3;
        }

        .input-area-wrapper {
            flex-shrink: 0;
            padding: 12px 28px 22px;
            display: flex;
            justify-content: center;
            background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.97) 28%);
        }

        .input-inner-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .preview-badge {
            display: none;
            align-items: center;
            gap: 9px;
            font-size: 11px;
            color: #547467;
            background: #f2f8f4;
            padding: 7px 10px;
            border-radius: 10px;
            width: fit-content;
            border: 1px solid var(--line);
        }

        .preview-badge img {
            width: 25px;
            height: 25px;
            object-fit: cover;
            border-radius: 6px;
        }

        .chat-input-bar {
            background: #fff;
            border: 1px solid #dcebe3;
            border-radius: 17px;
            padding: 9px 10px 9px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 7px 24px rgba(25, 77, 57, .065);
        }

        .chat-input-bar:focus-within {
            border-color: #9bcbb4;
            box-shadow: 0 8px 27px rgba(25, 77, 57, .1);
        }

        .upload-pin {
            color: #6e8c7e;
            font-size: 16px;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .inline-field {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: 0;
            outline: 0;
            font-size: 13px;
            color: var(--text);
            padding: 8px 0;
        }

        .inline-field::placeholder {
            color: #96aca1;
        }

        .field-divider {
            width: 1px;
            height: 24px;
            background: var(--line);
            flex-shrink: 0;
        }

        .send-arrow-btn {
            background: var(--green);
            color: #fff;
            border: 0;
            width: 39px;
            height: 39px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .send-arrow-btn:disabled {
            background: #a9c7b8;
            cursor: not-allowed;
        }

        .footer-note {
            font-size: 10px;
            color: #8ba197;
            text-align: center;
        }

        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 18px;
        }

        .page-heading h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            letter-spacing: -.6px;
            color: #153b2d;
        }

        .page-heading p {
            margin-top: 5px;
            color: var(--muted);
            font-size: 12px;
        }

        .list-tools {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .search-box {
            border: 1px solid var(--line);
            border-radius: 11px;
            background: #fff;
            padding: 10px 12px;
            outline: 0;
            min-width: 180px;
            font-size: 12px;
        }

        .history-list {
            display: grid;
            gap: 10px;
        }

        .history-card {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 13px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 3px 12px rgba(25, 77, 57, .025);
        }

        .food-thumb {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--mint);
            display: grid;
            place-items: center;
            color: var(--green);
            font-size: 18px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .food-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .history-info {
            min-width: 0;
            flex: 1;
        }

        .history-info h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--deep);
            overflow-wrap: anywhere;
        }

        .history-info p {
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px;
            line-height: 1.5;
        }

        .history-date {
            font-size: 10px;
            color: #94a99f;
            margin-top: 5px;
        }

        .card-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .small-btn {
            border: 1px solid var(--line);
            background: #f8fbf9;
            color: #557668;
            border-radius: 9px;
            padding: 8px 9px;
            font-size: 11px;
        }

        .small-btn:hover {
            background: var(--mint);
            color: var(--green);
        }

        .small-btn.favorite.active {
            background: #fff4d8;
            color: #9b7100;
            border-color: #f2e2aa;
        }

        .empty-state {
            text-align: center;
            padding: 70px 20px;
            color: var(--muted);
        }

        .empty-state .empty-icon {
            font-size: 28px;
            color: #9bb9aa;
            margin-bottom: 13px;
        }

        .empty-state h2 {
            font-size: 16px;
            color: var(--deep);
            margin-bottom: 7px;
        }

        .empty-state p {
            font-size: 12px;
            line-height: 1.6;
        }

        .profile-card {
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 15px;
            padding: 20px;
            max-width: 650px;
        }

        .profile-card h2 {
            font-size: 15px;
            margin-bottom: 8px;
        }

        .profile-card p {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.7;
        }

        .danger-btn {
            margin-top: 16px;
            border: 1px solid #f0d8d8;
            background: #fff7f7;
            color: var(--danger);
            padding: 10px 13px;
            border-radius: 10px;
            font-size: 12px;
        }

        .toast {
            position: fixed;
            bottom: 95px;
            left: 50%;
            transform: translateX(-50%);
            background: #123f30;
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 12px;
            box-shadow: var(--shadow);
            z-index: 100;
            display: none;
            max-width: 90%;
            text-align: center;
        }

        @media (max-width: 900px) and (min-width: 651px) {
            .app-shell {
                grid-template-columns: 170px minmax(0, 1fr);
                gap: 10px;
                padding: 10px;
            }

            .sidebar {
                padding: 15px 8px 12px;
                overflow-y: auto;
            }

            .brand {
                padding: 0 5px 22px;
            }

            .nav-item {
                padding: 10px 8px;
                gap: 9px;
                font-size: 11px;
            }

            .topbar {
                padding: 0 18px;
            }

            .chat-container {
                padding: 20px 16px;
            }

            .input-area-wrapper {
                padding: 10px 16px 15px;
            }

            .welcome-panel {
                padding-left: 8px;
                padding-right: 8px;
            }
        }

        @media (max-width: 650px) {
            body {
                background: var(--page);
            }

            .app-shell {
                display: flex;
                flex-direction: column;
                gap: 0;
                padding: 0 0 calc(76px + env(safe-area-inset-bottom));
                height: 100dvh;
            }

            /* Mobile bottom navigation retains all four sidebar buttons. */
            .sidebar {
                display: flex;
                position: fixed;
                z-index: 50;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                height: auto;
                min-height: 66px;
                flex-direction: column;
                padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
                border-radius: 16px 16px 0 0;
                border-left: 0;
                border-right: 0;
                border-bottom: 0;
                box-shadow: 0 -6px 24px rgba(25, 77, 57, .08);
                background: rgba(255, 255, 255, .97);
            }

            .sidebar .brand,
            .sidebar-bottom {
                display: none;
            }

            .nav-list {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 4px;
                width: 100%;
            }

            .nav-item {
                min-width: 0;
                min-height: 50px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 4px;
                padding: 6px 2px;
                border-radius: 10px;
                text-align: center;
                font-size: 10px;
                white-space: nowrap;
            }

            .nav-item i {
                width: auto;
                font-size: 15px;
            }

            .main-panel {
                border: 0;
                border-radius: 0;
                box-shadow: none;
                height: 100%;
                min-height: 0;
                background: transparent;
                flex: 1;
            }

            .topbar {
                height: 58px;
                padding: 0 16px;
                background: rgba(255, 255, 255, .92);
            }

            .topbar-title span {
                font-size: 14px;
            }

            .topbar-status {
                font-size: 10px;
            }

            .chat-container {
                padding: 16px 12px 14px;
            }

            .welcome-panel {
                padding: 7vh 5px 24px;
            }

            .welcome-mark {
                width: 52px;
                height: 52px;
                border-radius: 17px;
                margin-bottom: 15px;
            }

            .welcome-panel h1 {
                font-size: 27px;
            }

            .welcome-subtitle {
                font-size: 12px;
            }

            .quick-section {
                margin-top: 20px;
            }

            .quick-chip {
                padding: 8px 10px;
                font-size: 10px;
            }

            .message-row {
                font-size: 12px;
                gap: 8px;
            }

            .message-bubble {
                max-width: 91%;
                padding: 11px 13px;
            }

            .ai-mark {
                width: 27px;
                height: 27px;
                border-radius: 9px;
                font-size: 12px;
            }

            .message-row.ai .message-bubble {
                max-width: calc(100% - 35px);
            }

            .input-area-wrapper {
                padding: 8px 10px max(12px, env(safe-area-inset-bottom));
                background: linear-gradient(180deg, rgba(244,249,246,0), rgba(244,249,246,.98) 25%);
            }

            .chat-input-bar {
                border-radius: 15px;
                padding: 6px 7px 6px 10px;
                gap: 7px;
            }

            .inline-field {
                font-size: 11px;
            }

            .upload-pin {
                font-size: 14px;
                padding: 4px;
            }

            .send-arrow-btn {
                width: 35px;
                height: 35px;
                border-radius: 11px;
            }

            .footer-note {
                font-size: 9px;
            }

            .page-heading {
                display: block;
            }

            .page-heading h1 {
                font-size: 22px;
            }

            .list-tools {
                margin-top: 12px;
            }

            .search-box {
                min-width: 0;
                width: 100%;
            }

            .history-card {
                align-items: flex-start;
                gap: 9px;
                padding: 10px;
            }

            .food-thumb {
                width: 40px;
                height: 40px;
            }

            .history-info h3 {
                font-size: 12px;
            }

            .card-actions {
                flex-direction: column;
            }

            .small-btn {
                padding: 7px 8px;
            }

            .history-date {
                font-size: 9px;
            }
        }

        @media (max-width: 370px) {
            .chat-input-bar {
                gap: 5px;
            }

            .inline-field {
                font-size: 10px;
            }

            .field-divider {
                height: 19px;
            }

            .quick-chips {
                gap: 6px;
            }

            .nav-item {
                font-size: 9px;
            }
        }
    </style>
</head>

<body>
    <div class="app-shell">

        <aside class="sidebar" aria-label="Main navigation">
            <div class="brand">
                <img src="logo.png" alt="HealthBite logo">
                <span class="brand-name">HealthBite</span>
            </div>

            <nav class="nav-list">
                <button class="nav-item active" data-view="chat" type="button">
                    <i class="fa-regular fa-message"></i>
                    <span>New Chat</span>
                </button>

                <button class="nav-item" data-view="history" type="button">
                    <i class="fa-regular fa-clock"></i>
                    <span>History</span>
                </button>

                <button class="nav-item" data-view="saved" type="button">
                    <i class="fa-regular fa-bookmark"></i>
                    <span>Saved Foods</span>
                </button>

                <button class="nav-item" data-view="profile" type="button">
                    <i class="fa-regular fa-user"></i>
                    <span>Profile</span>
                </button>
            </nav>

            <div class="sidebar-bottom">
                <div class="avatar">HB</div>
                <div class="profile-meta">
                    <strong>HealthBite User</strong>
                    <span>Saved on this device</span>
                </div>
                <i class="fa-solid fa-chevron-right"></i>
            </div>
        </aside>

        <main class="main-panel">
            <header class="topbar">
                <div class="topbar-title">
                    <img src="logo.png" alt="">
                    <span>HealthBite</span>
                </div>

                <div class="topbar-status">
                    <span class="status-dot"></span>
                    <span id="statusText">Food guidance assistant</span>
                </div>
            </header>

            <div class="chat-container" id="chatContainer">
                <div class="chat-width-limiter" id="chatLimiter"></div>
            </div>

            <div class="input-area-wrapper" id="inputArea">
                <div class="input-inner-container">

                    <div class="preview-badge" id="previewBadge">
                        <img id="thumbPreview" alt="Image preview">
                        <span id="fileNameDisplay">Image attached</span>
                        <i class="fa-solid fa-xmark"
                           role="button"
                           tabindex="0"
                           aria-label="Remove image"
                           onclick="clearImage()"
                           style="cursor:pointer;margin-left:4px"></i>
                    </div>

                    <div class="chat-input-bar">
                        <label class="upload-pin" title="Attach food or product label image">
                            <input type="file"
                                   id="imageInput"
                                   accept="image/*"
                                   hidden
                                   onchange="handleFileSelect(event)">
                            <i class="fa-solid fa-paperclip"></i>
                        </label>

                        <input type="text"
                               id="diseaseInput"
                               class="inline-field"
                               placeholder="Health condition"
                               aria-label="Health condition"
                               onkeydown="handleKey(event)">

                        <div class="field-divider"></div>

                        <input type="text"
                               id="foodInput"
                               class="inline-field"
                               placeholder="Food item"
                               aria-label="Food item"
                               onkeydown="handleKey(event)">

                        <button class="send-arrow-btn"
                                id="sendBtn"
                                type="button"
                                onclick="submitAnalysis()"
                                aria-label="Analyze food">
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>
                    </div>

                    <div class="footer-note">
                        HealthBite can make mistakes. Check important health information.
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script>
        // IMPORTANT:
        // Use a newly rotated API key here, or preferably call Gemini
        // through your own backend so the key is not exposed in the browser.
        const API_KEY = "AQ.Ab8RN6KEH6tUEuZO37AIBlIidYt8us43XfmxZbpsff8TveatGw";
        const MODEL_NAME = "gemini-3.6-flash";

        const HISTORY_KEY = "healthbite_history_v1";
        const SAVED_KEY = "healthbite_saved_v1";

        let base64ImageString = null;
        let currentView = "chat";
        let activeRecordId = null;
        let toastTimer = null;

        // -------------------------------
        // Local storage
        // -------------------------------

        function readStore(key) {
            try {
                const value = JSON.parse(localStorage.getItem(key) || "[]");
                return Array.isArray(value) ? value : [];
            } catch (error) {
                return [];
            }
        }

        function writeStore(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
                return true;
            } catch (error) {
                showToast("Browser storage is full. Try removing older saved items.");
                return false;
            }
        }

        function getHistory() {
            return readStore(HISTORY_KEY);
        }

        function getSaved() {
            return readStore(SAVED_KEY);
        }

        function showToast(message) {
            const element = document.getElementById("toast");

            element.textContent = message;
            element.style.display = "block";

            clearTimeout(toastTimer);

            toastTimer = setTimeout(function () {
                element.style.display = "none";
            }, 2600);
        }

        // -------------------------------
        // Safe output formatting
        // -------------------------------

        function escapeHtml(text) {
            return String(text ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function formatOutput(text) {
            let formatted = escapeHtml(text);

            formatted = formatted.replace(
                /\*\*(.*?)\*\*/g,
                "<strong>$1</strong>"
            );

            formatted = formatted.replace(/\n/g, "<br>");

            return formatted;
        }

        function safeDate(value) {
            try {
                return new Date(value).toLocaleString(undefined, {
                    dateStyle: "medium",
                    timeStyle: "short"
                });
            } catch (error) {
                return "";
            }
        }

        // -------------------------------
        // Navigation
        // -------------------------------

        function setActiveNav(view) {
            document.querySelectorAll(".nav-item").forEach(function (button) {
                const active = button.dataset.view === view;

                button.classList.toggle("active", active);

                if (active) {
                    button.setAttribute("aria-current", "page");
                } else {
                    button.removeAttribute("aria-current");
                }
            });
        }

        function setView(view) {
            currentView = view;

            setActiveNav(view);

            const inputArea = document.getElementById("inputArea");
            const limiter = document.getElementById("chatLimiter");
            const status = document.getElementById("statusText");

            inputArea.style.display = view === "chat" ? "flex" : "none";

            limiter.innerHTML = "";

            document.getElementById("chatContainer").scrollTop = 0;

            if (view === "chat") {
                status.textContent = "Food guidance assistant";
                activeRecordId = null;
                renderWelcome();
            }

            if (view === "history") {
                status.textContent = "Your previous analyses";
                renderCollection("history");
            }

            if (view === "saved") {
                status.textContent = "Your bookmarked guidance";
                renderCollection("saved");
            }

            if (view === "profile") {
                status.textContent = "Your local preferences";
                renderProfile();
            }
        }

        // -------------------------------
        // Welcome screen
        // -------------------------------

        function renderWelcome() {
            document.getElementById("chatLimiter").innerHTML = `
                <section class="welcome-panel">
                    <div class="welcome-mark">
                        <i class="fa-solid fa-leaf"></i>
                    </div>

                    <h1>Hello!</h1>

                    <p class="welcome-subtitle">
                        What are you eating?<br>
                        What condition do you have?
                    </p>

                    <div class="quick-section">
                        <h2>Quick suggestions</h2>

                        <p>Choose a condition, then enter your food below</p>

                        <div class="quick-chips">
                            <button class="quick-chip" data-condition="Diabetes">
                                <i class="fa-solid fa-droplet"></i>
                                Diabetes
                            </button>

                            <button class="quick-chip" data-condition="High Blood Pressure">
                                <i class="fa-solid fa-heart-pulse"></i>
                                High Blood Pressure
                            </button>

                            <button class="quick-chip" data-condition="Heart Health">
                                <i class="fa-solid fa-heart"></i>
                                Heart Health
                            </button>

                            <button class="quick-chip" data-condition="Kidney Health">
                                <i class="fa-solid fa-kidneys"></i>
                                Kidney Health
                            </button>
                        </div>
                    </div>

                    <p class="welcome-footnote">
                        Better food choices. Healthier you.
                    </p>
                </section>
            `;

            document.querySelectorAll(".quick-chip").forEach(function (chip) {
                chip.addEventListener("click", function () {
                    document.getElementById("diseaseInput").value =
                        chip.dataset.condition;

                    document.getElementById("foodInput").focus();
                });
            });
        }

        // -------------------------------
        // History and Saved Foods
        // -------------------------------

        function renderCollection(type) {
            const isSaved = type === "saved";

            const records = isSaved ? getSaved() : getHistory();

            const limiter = document.getElementById("chatLimiter");

            const heading = isSaved ? "Saved Foods" : "History";

            const subtitle = isSaved
                ? "Your bookmarked food analyses and recommendations."
                : "Your previous food and health analyses.";

            let html = `
                <section>
                    <div class="page-heading">
                        <div>
                            <h1>${heading}</h1>
                            <p>${subtitle}</p>
                        </div>

                        <div class="list-tools">
                            <input
                                class="search-box"
                                id="recordSearch"
                                type="search"
                                placeholder="Search food or condition..."
                                aria-label="Search analyses">
                        </div>
                    </div>

                    <div class="history-list" id="recordList">
            `;

            if (!records.length) {
                html += `
                    </div>

                    <div class="empty-state">
                        <div class="empty-icon">
                            <i class="fa-regular ${isSaved ? "fa-bookmark" : "fa-clock"}"></i>
                        </div>

                        <h2>${isSaved ? "No saved foods yet" : "No history yet"}</h2>

                        <p>
                            ${isSaved
                                ? "When an analysis is useful, tap Save result to keep it here."
                                : "Your completed analyses will automatically appear here."}
                        </p>
                    </div>
                </section>
                `;

                limiter.innerHTML = html;
                return;
            }

            html += `
                    </div>
                </section>
            `;

            limiter.innerHTML = html;

            const search = document.getElementById("recordSearch");
            const list = document.getElementById("recordList");

            function draw(filter = "") {
                const term = filter.trim().toLowerCase();

                const filtered = records.filter(function (record) {
                    return (
                        (record.food || "") + " " +
                        (record.disease || "") + " " +
                        (record.response || "")
                    ).toLowerCase().includes(term);
                });

                if (!filtered.length) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <h2>No matching analyses</h2>
                            <p>Try another food or condition.</p>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = filtered.map(function (record) {
                    const saved = isFavorite(record.id);

                    const thumbnail = record.image
                        ? `<img src="${record.image}" alt="Food label">`
                        : `<i class="fa-solid fa-utensils"></i>`;

                    const responsePreview = (record.response || "")
                        .replace(/\*\*/g, "")
                        .slice(0, 145);

                    const extra = (record.response || "").length > 145
                        ? "…"
                        : "";

                    return `
                        <article class="history-card">
                            <div class="food-thumb">
                                ${thumbnail}
                            </div>

                            <div class="history-info">
                                <h3>
                                    ${escapeHtml(record.food || "Food label image")}
                                    <span style="color:#91a99d;font-weight:400">
                                        + ${escapeHtml(record.disease)}
                                    </span>
                                </h3>

                                <p>
                                    ${escapeHtml(responsePreview)}${extra}
                                </p>

                                <div class="history-date">
                                    ${safeDate(record.createdAt)}
                                </div>
                            </div>

                            <div class="card-actions">
                                <button
                                    class="small-btn"
                                    title="Open analysis"
                                    aria-label="Open analysis"
                                    onclick="openRecord('${record.id}')">
                                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                                </button>

                                <button
                                    class="small-btn favorite ${saved ? "active" : ""}"
                                    title="${saved ? "Remove saved result" : "Save result"}"
                                    aria-label="${saved ? "Remove saved result" : "Save result"}"
                                    onclick="toggleFavorite('${record.id}')">
                                    <i class="${saved ? "fa-solid" : "fa-regular"} fa-bookmark"></i>
                                </button>

                                ${isSaved ? "" : `
                                    <button
                                        class="small-btn"
                                        title="Delete history item"
                                        aria-label="Delete history item"
                                        onclick="deleteRecord('${record.id}')">
                                        <i class="fa-regular fa-trash-can"></i>
                                    </button>
                                `}
                            </div>
                        </article>
                    `;
                }).join("");
            }

            draw();

            search.addEventListener("input", function () {
                draw(search.value);
            });
        }

        function isFavorite(id) {
            return getSaved().some(function (record) {
                return record.id === id;
            });
        }

        function toggleFavorite(id) {
            const record =
                getHistory().find(function (item) {
                    return item.id === id;
                }) ||
                getSaved().find(function (item) {
                    return item.id === id;
                });

            if (!record) {
                showToast("This analysis is no longer available.");
                return;
            }

            let saved = getSaved();

            if (saved.some(function (item) {
                return item.id === id;
            })) {
                saved = saved.filter(function (item) {
                    return item.id !== id;
                });

                writeStore(SAVED_KEY, saved);

                showToast("Removed from Saved Foods.");
            } else {
                saved.unshift(record);

                if (!writeStore(SAVED_KEY, saved)) {
                    return;
                }

                showToast("Analysis saved to Saved Foods.");
            }

            if (currentView === "saved") {
                renderCollection("saved");
            } else if (currentView === "history") {
                renderCollection("history");
            } else if (currentView === "chat" && activeRecordId === id) {
                renderChatRecord(record);
            }
        }

        function deleteRecord(id) {
            if (!confirm(
                "Delete this analysis from history? If it is saved, its saved copy will remain."
            )) {
                return;
            }

            writeStore(
                HISTORY_KEY,
                getHistory().filter(function (record) {
                    return record.id !== id;
                })
            );

            showToast("History item deleted.");

            renderCollection("history");
        }

        // -------------------------------
        // Open a previous analysis
        // -------------------------------

        function openRecord(id) {
            const record =
                getHistory().find(function (item) {
                    return item.id === id;
                }) ||
                getSaved().find(function (item) {
                    return item.id === id;
                });

            if (!record) {
                showToast("Analysis not found.");
                return;
            }

            activeRecordId = id;
            currentView = "chat";

            setActiveNav("chat");

            document.getElementById("inputArea").style.display = "none";

            document.getElementById("statusText").textContent =
                "Previous analysis";

            renderChatRecord(record);
        }

        function renderChatRecord(record) {
            const limiter = document.getElementById("chatLimiter");

            const saved = isFavorite(record.id);

            limiter.innerHTML = `
                <div class="page-heading">
                    <div>
                        <h1>Food analysis</h1>
                        <p>${safeDate(record.createdAt)}</p>
                    </div>

                    <button class="small-btn" onclick="setView('history')">
                        <i class="fa-solid fa-arrow-left"></i>
                        Back
                    </button>
                </div>

                <div class="message-row user">
                    <div class="message-bubble">
                        <div>
                            <strong>${escapeHtml(record.disease)}</strong>
                            + ${escapeHtml(record.food || "Product label")}
                        </div>

                        ${record.image
                            ? `<img src="${record.image}" alt="Uploaded food label">`
                            : ""}
                    </div>
                </div>

                <div class="message-row ai">
                    <div class="ai-mark">
                        <i class="fa-solid fa-leaf"></i>
                    </div>

                    <div class="message-bubble">
                        ${formatOutput(record.response)}

                        <div class="message-actions">
                            <button
                                class="icon-action ${saved ? "saved" : ""}"
                                onclick="toggleFavorite('${record.id}')">
                                <i class="${saved ? "fa-solid" : "fa-regular"} fa-bookmark"></i>
                                ${saved ? "Saved" : "Save result"}
                            </button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById("chatContainer").scrollTop = 0;
        }

        // -------------------------------
        // Profile and local data settings
        // -------------------------------

        function renderProfile() {
            const history = getHistory();
            const saved = getSaved();

            document.getElementById("chatLimiter").innerHTML = `
                <section>
                    <div class="page-heading">
                        <div>
                            <h1>Profile & Settings</h1>
                            <p>Manage your HealthBite data on this device.</p>
                        </div>
                    </div>

                    <div class="profile-card">
                        <h2>
                            <i class="fa-regular fa-user"
                               style="color:var(--green);margin-right:8px"></i>
                            HealthBite User
                        </h2>

                        <p>
                            Your analysis history and saved results are stored
                            in this browser using local storage. They are not
                            synced to another device. Clearing browser data
                            may remove them.
                            <br><br>
                            <strong>${history.length}</strong> history item(s)
                            ·
                            <strong>${saved.length}</strong> saved result(s).
                        </p>

                        <button class="danger-btn" onclick="clearAllData()">
                            <i class="fa-regular fa-trash-can"></i>
                            Clear all local history and saved foods
                        </button>
                    </div>
                </section>
            `;
        }

        function clearAllData() {
            if (!confirm(
                "Permanently clear all HealthBite history and saved foods from this browser?"
            )) {
                return;
            }

            localStorage.removeItem(HISTORY_KEY);
            localStorage.removeItem(SAVED_KEY);

            showToast("Local history and saved foods cleared.");

            renderProfile();
        }

        // -------------------------------
        // Image upload
        // -------------------------------

        function handleFileSelect(event) {
            const file = event.target.files[0];

            if (!file) {
                return;
            }

            if (!file.type.startsWith("image/")) {
                showToast("Please select an image file.");
                return;
            }

            const reader = new FileReader();

            reader.onload = function (e) {
                base64ImageString = e.target.result.split(",")[1];

                document.getElementById("thumbPreview").src = e.target.result;

                document.getElementById("fileNameDisplay").textContent =
                    file.name;

                document.getElementById("previewBadge").style.display = "flex";
            };

            reader.readAsDataURL(file);
        }

        function clearImage() {
            base64ImageString = null;

            document.getElementById("imageInput").value = "";

            document.getElementById("previewBadge").style.display = "none";

            document.getElementById("thumbPreview").removeAttribute("src");
        }

        function handleKey(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                submitAnalysis();
            }
        }

        function scrollToBottom() {
            const container = document.getElementById("chatContainer");
            container.scrollTop = container.scrollHeight;
        }

        // -------------------------------
        // Render messages
        // -------------------------------

        function addMessageMarkup(record) {
            const limiter = document.getElementById("chatLimiter");

            const saved = isFavorite(record.id);

            limiter.insertAdjacentHTML("beforeend", `
                <div class="message-row user">
                    <div class="message-bubble">
                        <div>
                            <strong>${escapeHtml(record.disease)}</strong>
                            + ${escapeHtml(record.food || "Product Label")}
                        </div>

                        ${record.image
                            ? `<img src="${record.image}" alt="Uploaded label">`
                            : ""}
                    </div>
                </div>

                <div class="message-row ai">
                    <div class="ai-mark">
                        <i class="fa-solid fa-leaf"></i>
                    </div>

                    <div class="message-bubble">
                        ${formatOutput(record.response)}

                        <div class="message-actions">
                            <button
                                class="icon-action ${saved ? "saved" : ""}"
                                onclick="toggleFavorite('${record.id}')">
                                <i class="${saved ? "fa-solid" : "fa-regular"} fa-bookmark"></i>
                                ${saved ? "Saved" : "Save result"}
                            </button>
                        </div>
                    </div>
                </div>
            `);
        }

        // -------------------------------
        // Gemini food analysis
        // -------------------------------

        async function submitAnalysis() {
            if (currentView !== "chat") {
                setView("chat");
            }

            const disease = document.getElementById("diseaseInput").value.trim();
            const food = document.getElementById("foodInput").value.trim();
            const sendBtn = document.getElementById("sendBtn");

            if (!disease) {
                alert("Please enter a disease or condition.");
                document.getElementById("diseaseInput").focus();
                return;
            }

            if (!food && !base64ImageString) {
                alert("Please enter a food item or attach an image.");
                document.getElementById("foodInput").focus();
                return;
            }

            const limiter = document.getElementById("chatLimiter");

            if (limiter.querySelector(".welcome-panel")) {
                limiter.innerHTML = "";
            }

            document.getElementById("inputArea").style.display = "flex";

            document.getElementById("statusText").textContent =
                "Analyzing food";

            const currentImage = base64ImageString;

            const imageData = currentImage
                ? `data:image/jpeg;base64,${currentImage}`
                : null;

            const foodLabel = food || "Product label image";

            limiter.insertAdjacentHTML("beforeend", `
                <div class="message-row user">
                    <div class="message-bubble">
                        <div>
                            <strong>${escapeHtml(disease)}</strong>
                            + ${escapeHtml(foodLabel)}
                        </div>

                        ${imageData
                            ? `<img src="${imageData}" alt="Uploaded label">`
                            : ""}
                    </div>
                </div>
            `);

            document.getElementById("foodInput").value = "";

            clearImage();

            const aiMsgId = "ai-msg-" + Date.now();

            limiter.insertAdjacentHTML("beforeend", `
                <div class="message-row ai" id="${aiMsgId}">
                    <div class="ai-mark">
                        <i class="fa-solid fa-leaf"></i>
                    </div>

                    <div class="message-bubble" style="color:var(--muted)">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        Checking your food guidance...
                    </div>
                </div>
            `);

            scrollToBottom();

            sendBtn.disabled = true;

            try {
                const promptText = `Analyze safety for:
Condition: ${disease}
Item: ${food ? food : "Provided image"}

Provide a short, direct, point-to-point response using exact headings with bold formatting:
**Verdict:** [Eat / Do Not Eat / Caution]
**Portion:** [Safe quantity limit]
**Reason:** [One brief sentence]
**Pros:** [Short bullet point benefits]
**Cons & Risks:** [Short bullet point risks]
**Suggestion:** [One brief recommendation]`;

                const partsArray = [
                    {
                        text: promptText
                    }
                ];

                if (currentImage) {
                    partsArray.push({
                        inline_data: {
                            mime_type: "image/jpeg",
                            data: currentImage
                        }
                    });
                }

                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            contents: [
                                {
                                    parts: partsArray
                                }
                            ]
                        })
                    }
                );

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                const replyText =
                    data.candidates?.[0]?.content?.parts?.[0]?.text;

                if (!replyText) {
                    throw new Error("No analysis was returned.");
                }

                const record = {
                    id: (
                        crypto.randomUUID
                            ? crypto.randomUUID()
                            : "hb-" + Date.now() + "-" +
                              Math.random().toString(36).slice(2)
                    ),
                    disease: disease,
                    food: foodLabel,
                    response: replyText,
                    createdAt: new Date().toISOString(),
                    image: imageData
                };

                document.getElementById(aiMsgId).remove();

                addMessageMarkup(record);

                const history = getHistory();

                history.unshift(record);

                writeStore(HISTORY_KEY, history);

                activeRecordId = record.id;

                document.getElementById("statusText").textContent =
                    "Analysis complete";

            } catch (error) {
                console.error("API Error caught:", error);

                document.getElementById(aiMsgId)
                    .querySelector(".message-bubble").innerHTML =
                    "<strong>Notice:</strong> The service is temporarily busy or the request failed. Please check your connection and try again.";

                document.getElementById("statusText").textContent =
                    "Food guidance assistant";

            } finally {
                sendBtn.disabled = false;
                scrollToBottom();
            }
        }

        // -------------------------------
        // Navigation button events
        // -------------------------------

        document.querySelectorAll(".nav-item").forEach(function (button) {
            button.addEventListener("click", function () {
                setView(button.dataset.view);
            });
        });

        // Start on the New Chat page.
        setView("chat");
    </script>
</body>
</html>
